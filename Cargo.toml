[package]
name = "cosmic-edit"
version = "1.11.0"
authors = ["Jeremy Soller <jeremy@system76.com>"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[dependencies]
dirs = "6"
env_logger = "0.11.8"
grep = "0.3.2"
ignore = "0.4.23"
log = "0.4.28"
notify = "8.2.0"
open = "5.3.2"
paste = "1.0.15"
patch = "0.7.0"
regex = "1.11"
serde = { version = "1", features = ["serde_derive"] }
tokio = { version = "1", features = ["process", "time"] }
# Extra syntax highlighting
syntect = "5.2.0"
two-face = "0.4.3"
# Internationalization
icu = { version = "2.0.0", features = ["compiled_data"] }
unicode-segmentation = "1.12"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8"

[dependencies.cosmic-files]
git = "https://github.com/pop-os/cosmic-files.git"
default-features = false

[dependencies.cosmic-syntax-theme]
git = "https://github.com/pop-os/cosmic-syntax-theme.git"

[dependencies.cosmic-text]
version = "0.19"
features = ["syntect", "vi"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
#TODO: a11y feature crashes file choser dialog
features = ["about", "multi-window", "tokio", "winit", "surface-message"]

[target.'cfg(unix)'.dependencies]
fork = "0.2"

[build-dependencies]
xdgen = "0.1"

[features]
default = ["dbus-config", "gvfs", "wgpu", "wayland"]
dbus-config = ["libcosmic/dbus-config"]
gvfs = ["cosmic-files/gvfs"]
wgpu = ["libcosmic/wgpu", "cosmic-files/wgpu"]
wayland = ["libcosmic/wayland", "cosmic-files/wayland"]

[profile.release-with-debug]
inherits = "release"
debug = true

# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# cosmic-config = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }
# cosmic-theme = { git = "https://github.com/pop-os/libcosmic//", branch = "theme-v2" }

# [patch."https://github.com/pop-os/cosmic-files.git"]
# cosmic-files = { git = "https://github.com/pop-os/cosmic-files//", branch = "theme-v2" }

[patch.crates-io]
# NoctOS: fork 0.11.0 with its posix_spawn flag constants widened; they are
# c_short on illumos and the crate assumes c_int.
fork = { path = "../cosmic-files/noctos-vendor/fork" }
# NoctOS: notify with a native illumos backend (event ports), so that
# config-file changes are noticed as they are on Linux.
notify = { path = "../cosmic-comp/noctos-vendor/notify" }
# NoctOS: illumos-patched crates from the sibling cosmic-comp fork checkout
calloop = { path = "../cosmic-comp/noctos-vendor/calloop" }
polling = { path = "../cosmic-comp/noctos-vendor/polling" }
wayland-backend = { path = "../cosmic-comp/noctos-vendor/wayland-backend" }
# pulled in by softbuffer (software renderer); rustix has no ioctl opcode
# helpers on illumos
drm-ffi = { path = "../cosmic-comp/noctos-vendor/drm-ffi-0.7" }

# NoctOS: pop-os/winit at the pinned rev 9567503 plus an illumos arm for
# is_main_thread. Every crate of that workspace is redirected so the types
# stay identical across the dependency graph.
[patch."https://github.com/pop-os/winit.git"]
dpi = { path = "../cosmic-launcher/noctos-vendor/winit/dpi" }
winit = { path = "../cosmic-launcher/noctos-vendor/winit/winit" }
winit-android = { path = "../cosmic-launcher/noctos-vendor/winit/winit-android" }
winit-appkit = { path = "../cosmic-launcher/noctos-vendor/winit/winit-appkit" }
winit-common = { path = "../cosmic-launcher/noctos-vendor/winit/winit-common" }
winit-core = { path = "../cosmic-launcher/noctos-vendor/winit/winit-core" }
winit-orbital = { path = "../cosmic-launcher/noctos-vendor/winit/winit-orbital" }
winit-uikit = { path = "../cosmic-launcher/noctos-vendor/winit/winit-uikit" }
winit-wayland = { path = "../cosmic-launcher/noctos-vendor/winit/winit-wayland" }
winit-web = { path = "../cosmic-launcher/noctos-vendor/winit/winit-web" }
winit-win32 = { path = "../cosmic-launcher/noctos-vendor/winit/winit-win32" }
winit-x11 = { path = "../cosmic-launcher/noctos-vendor/winit/winit-x11" }

# NoctOS: pop-os/softbuffer (tag cosmic-4.0, c2b2c19) with a POSIX-correct
# shm_open name.
[patch."https://github.com/pop-os/softbuffer"]
softbuffer = { path = "../cosmic-launcher/noctos-vendor/softbuffer" }

# NoctOS: libcosmic from the sibling fork checkout (pop-os/libcosmic be7937d,
# the rev this tree locks, plus the fix that makes per-surface views work on
# non-Linux Wayland platforms). Every crate that comes from that repository is
# redirected so there is a single copy of each in the dependency graph.
[patch."https://github.com/pop-os/libcosmic.git"]
libcosmic = { path = "../libcosmic" }
build_helpers = { path = "../libcosmic/iced/build_helpers" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-launch = { path = "../libcosmic/cosmic-launch" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }

# NoctOS: cosmic-files from the sibling fork checkout (builds on illumos).
[patch."https://github.com/pop-os/cosmic-files.git"]
cosmic-files = { path = "../cosmic-files" }
